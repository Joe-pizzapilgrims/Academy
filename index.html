<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pizza Pilgrims Academy Tools</title>

<style>
@font-face {

    font-family: "PizzaPilgrims";
    src: url("./pizzapilgrims.otf") format("opentype");
    font-weight: normal;
    font-style: normal;

}
    
:root{
    --green:#063f2c;
    --light:#b8ff9c;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    position:relative;
    isolation:isolate;
    font-family:Arial,sans-serif;
    color:var(--green);

    background:
    linear-gradient(
        rgba(255,255,255,.72),
        rgba(255,255,255,.78)
    ),
    url("background.jpg") center center / cover no-repeat fixed;
}

.wrapper{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1300px;
    margin:auto;
    padding:40px 25px;
    text-align:center;
}

.logo{
    display:block;
    width:min(240px,75%);
    margin:auto;

    opacity:0;
    transform:translateY(-20px);
    animation:fadeDown .8s ease forwards;
}

h1{
    margin-top:30px;
    color:var(--green);
    font-family:"PizzaPilgrims", Arial, sans-serif;
    font-size:clamp(42px,6vw,72px);
    font-weight:normal;
    text-transform:uppercase;
    letter-spacing:2px;

    opacity:0;
    transform:translateY(-14px);
    animation:fadeDown .8s ease .18s forwards;
}

.subtitle{
    max-width:700px;
    margin:18px auto 60px;
    color:var(--green);
    font-size:clamp(18px,2vw,24px);
    line-height:1.5;

    opacity:0;
    transform:translateY(12px);
    animation:fadeUp .7s ease .42s forwards;
}

.buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
    flex-wrap:wrap;
}

.button-link{
    display:block;
    animation:buttonRise .75s cubic-bezier(.2,.75,.25,1) backwards;
    opacity:1;
    transform:none;
    transition:transform .25s ease;
}

.button-link:nth-child(1){
    animation-delay:.7s;
}

.button-link:nth-child(2){
    animation-delay:.9s;
}

.button-link:nth-child(3){
    animation-delay:1.1s;
}

.button-link:nth-child(4){
    animation-delay:1.3s;
}

.button-link:hover,
.button-link:focus-visible{
    transform:translateY(-8px) scale(1.04);
}

.button-link:focus-visible{
    outline:3px solid var(--green);
    outline-offset:8px;
    border-radius:12px;
}

.button-link img{
    display:block;
    width:220px;
    max-width:85vw;

    filter:drop-shadow(0 14px 18px rgba(0,0,0,.35));
    transition:filter .25s ease;
}

.button-link:hover img,
.button-link:focus-visible img{
    filter:drop-shadow(0 22px 26px rgba(0,0,0,.5));
}

.footer{
    margin-top:70px;
    color:var(--green);
    font-size:15px;
    font-weight:bold;

    opacity:0;
    transform:translateY(12px);
    animation:fadeUp .7s ease 1.55s forwards;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes buttonRise{
    from{
        opacity:0;
        transform:translateY(45px) scale(.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@media(max-width:1100px){

    .buttons{
        gap:30px;
    }

    .button-link img{
        width:200px;
    }

}

@media(max-width:900px){

    .buttons{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,200px));
        gap:24px;
    }

    .button-link img{
        width:100%;
        max-width:200px;
    }

    .subtitle{
        margin-bottom:40px;
    }

}

/* Decorative van sits between the background and the Academy content. */
.ape-scene{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
}
.ape-route{
    position:absolute;
    left:0;
    top:72%;
    width:110px;
    animation:apeJourney 48s linear infinite;
    will-change:transform;
}
.ape-van{
    display:block;
    width:100%;
    height:auto;
    opacity:.65;
    animation:apeTrundle .65s ease-in-out infinite alternate;
}
@keyframes apeJourney{
    0%{transform:translate(-140px,0) scaleX(1)}
    46%{transform:translate(calc(100vw + 30px),-18vh) scaleX(1)}
    49%{transform:translate(calc(100vw + 30px),-18vh) scaleX(1)}
    50%{transform:translate(calc(100vw + 30px),18vh) scaleX(-1)}
    96%{transform:translate(-140px,0) scaleX(-1)}
    99%{transform:translate(-140px,0) scaleX(-1)}
    100%{transform:translate(-140px,0) scaleX(1)}
}
@keyframes apeTrundle{
    from{transform:translateY(0) rotate(-.6deg)}
    to{transform:translateY(-2px) rotate(.6deg)}
}
@media(max-width:600px){
    .wrapper{padding:28px 20px}
    .logo{width:180px}
    h1{font-size:40px;letter-spacing:1px}
    .subtitle{font-size:18px;margin:16px auto 32px}
    .buttons{gap:20px}
    .footer{margin-top:40px;line-height:1.5}
    .ape-route{width:80px}
}

@media(prefers-reduced-motion:reduce){

    .ape-route{animation:none;left:16px;top:auto;bottom:20px}
    .ape-van{animation:none;opacity:.35}

    .logo,
    h1,
    .subtitle,
    .button-link,
    .footer{
        opacity:1;
        transform:none;
        animation:none;
    }

    .button-link,
    .button-link img{
        transition:none;
    }

}


/* Launch-page convenience gate; this is not server-side authentication. */
[hidden]{display:none!important}
.access-card{max-width:460px;margin:0 auto;padding:32px;background:rgba(255,255,255,.96);border:2px solid var(--green);border-radius:28px;box-shadow:0 16px 40px rgba(6,63,44,.14)}
.access-card h2{font-family:"PizzaPilgrims",Arial,sans-serif;font-size:38px;font-weight:normal;margin-bottom:12px}
.access-card p{line-height:1.5;margin-bottom:22px}
.access-card label{display:block;text-align:left;font-weight:bold;margin-bottom:10px}
.access-card input{display:block;width:100%;min-height:64px;border:2px solid var(--green);border-radius:16px;background:#f4fff0;color:var(--green);font-family:"PizzaPilgrims",Arial,sans-serif;font-size:32px;text-align:center;letter-spacing:6px;padding:12px}
.access-card input[aria-invalid="true"]{border-color:#a52a23}
.access-submit,.lock-button{border:2px solid var(--green);border-radius:16px;cursor:pointer;font-family:"PizzaPilgrims",Arial,sans-serif;font-size:26px;padding:14px 24px}
.access-submit{width:100%;margin-top:16px;background:var(--green);color:var(--light)}
.access-submit:hover{background:#0b573e}
.access-card input:focus-visible,.access-submit:focus-visible,.lock-button:focus-visible{outline:3px solid var(--green);outline-offset:4px}
.access-card .access-error{min-height:24px;margin:14px 0 0;color:#a52a23;font-size:15px}
.lock-button{margin-top:36px;background:var(--light);color:var(--green)}
@media(max-width:600px){.access-card{padding:24px 20px}.access-card h2{font-size:32px}}

</style>

</head>

<body>

<div class="ape-scene" aria-hidden="true">
    <div class="ape-route">
        <img class="ape-van" src="./ape.png" alt="" onerror="this.style.visibility='hidden'">
    </div>
</div>



<div class="wrapper">

    <img
        src="logo.png"
        class="logo"
        alt="Pizza Pilgrims"
    >

    <h1>Pizza Pilgrims Academy Tools</h1>

    <p class="subtitle">
        Training, development and promotion tools for Pizza Pilgrims.
    </p>


    <section class="access-card" id="access-gate" aria-labelledby="access-heading">
        <h2 id="access-heading">Welcome to the Academy</h2>
        <p>Enter your team access code to open the Academy tools.</p>
        <form id="access-form">
            <label for="access-code">Team access code</label>
            <input id="access-code" name="access-code" type="password" autocomplete="off"
                autocapitalize="characters" spellcheck="false" maxlength="32"
                aria-describedby="access-error" required>
            <button class="access-submit" type="submit">Enter Academy</button>
            <p class="access-error" id="access-error" role="alert"></p>
        </form>
        <noscript><p>Please enable JavaScript to enter the Academy.</p></noscript>
    </section>

    <div id="academy-tools" hidden>
    <div class="buttons">

        <a
            class="button-link"
            href="https://joe-pizzapilgrims.github.io/DeepDives/"
        >
            <img
                src="deepdive.png"
                alt="Open Deep Dives"
            >
        </a>

        <a
            class="button-link"
            href="https://joe-pizzapilgrims.github.io/Readinesstracker/"
        >
            <img
                src="development.png"
                alt="Open Development Tracker"
            >
        </a>

        <a
            class="button-link"
            href="https://joe-pizzapilgrims.github.io/PizzaPilgrimsSignOffs/"
        >
            <img
                src="signoff.png"
                alt="Open Promotion Sign-Offs"
            >
        </a>

        <a
            class="button-link"
            href="https://joe-pizzapilgrims.github.io/academydays/"
        >
            <img
                src="academyday.png"
                alt="Open Academy Days"
            >
        </a>

    </div>

        <button class="lock-button" id="lock-academy" type="button">Lock Academy</button>
    </div>

    <div class="footer">
        Making people happier, one pizza at a time.
    </div>

</div>
<script>
(function () {
    'use strict';
    // A client-side convenience gate only. Direct tool URLs remain accessible.
    const gate = document.getElementById('access-gate');
    const form = document.getElementById('access-form');
    const input = document.getElementById('access-code');
    const error = document.getElementById('access-error');
    const tools = document.getElementById('academy-tools');
    const lock = document.getElementById('lock-academy');
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (input.value.trim().toUpperCase() !== 'PPA27') {
            input.setAttribute('aria-invalid', 'true');
            error.textContent = 'That code is not quite right. Please try again.';
            input.focus();
            input.select();
            return;
        }
        input.value = '';
        input.removeAttribute('aria-invalid');
        error.textContent = '';
        gate.hidden = true;
        tools.hidden = false;
        tools.querySelector('a').focus();
    });
    input.addEventListener('input', function () {
        input.removeAttribute('aria-invalid');
        error.textContent = '';
    });
    lock.addEventListener('click', function () {
        tools.hidden = true;
        gate.hidden = false;
        input.value = '';
        input.focus();
    });
}());
</script>
</body>
</html>
